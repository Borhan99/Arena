name: the_project
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  equatable: ^2.0.5
  flutter_bloc: ^9.1.1
  easy_localization: ^3.0.7
  retrofit: ^4.4.1
  get_it: ^9.2.1
  flutter_animate: ^4.5.2
  supabase_flutter: ^2.12.4
  url_launcher: ^6.2.5
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.13.1
  json_serializable: ^6.13.1
  retrofit_generator: ^10.2.5
  flutter_gen_runner: ^5.14.0
  flutter_launcher_icons: ^0.13.1
  mocktail: ^1.0.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/launcher_logo.png"
  image_path_ios: "assets/images/launcher_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/launcher_logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/
    - assets/translations/
    - .env

